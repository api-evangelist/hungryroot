aid: hungryroot
name: Hungryroot
description: >-
  Hungryroot is a personalized grocery and meal-planning service that blends
  meal-kit convenience with grocery-store variety. Its AI-driven personalization
  engine builds each customer's cart from dietary preferences, health goals, and
  budget, drawing on a catalog of 50,000+ recipes and curated grocery products
  that support high-protein, gluten-free, vegan, and other dietary needs.
  Hungryroot is a direct-to-consumer company backed by Lightspeed Venture
  Partners; it operates a consumer web and mobile app experience rather than a
  public developer platform. This profile was surfaced through the venture
  portfolio graph and enriched by the API Evangelist pipeline, which probed the
  provider's domain and public discovery surfaces (no public API, OpenAPI, SDKs,
  well-known catalog, security.txt, or llms.txt were found as of this pass).
